# E2E stack: the production image plus a Playwright container.
#
#   ./run.sh                 full run, fresh database, exits with the suite's code
#   docker compose -f docker-compose.test.yml up --build terminal   app only, on :8000
#
# Browser dependencies stay in the Playwright image and never enter the
# production image.
name: finally-e2e

services:
  # Named "terminal", not "app": Chromium treats the single-label host `app`
  # as matching the HSTS-preloaded `.app` TLD and refuses plain HTTP to it,
  # failing every navigation with ERR_SSL_PROTOCOL_ERROR.
  terminal:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      # Deterministic chat replies, per LLM_MOCK_CONTRACT.md.
      LLM_MOCK: "true"
      # Empty: the backend falls back to the built-in market simulator.
      MASSIVE_API_KEY: ""
      # Never needed in mock mode. Declared empty so a stray shell export
      # cannot leak a real key into the run.
      OPENROUTER_API_KEY: ""
      DB_PATH: /app/db/finally.db
      PYTHONUNBUFFERED: "1"
    volumes:
      # A tmpfs, not a named volume: every run starts from a freshly seeded
      # database, which is what the fresh-start spec asserts against.
      - type: tmpfs
        target: /app/db
        tmpfs:
          mode: 0o1777
    ports:
      # Not 8000: the suite never needs a host port (the Playwright container
      # reaches this service over the compose network), and publishing 8000
      # collides with the app's own start scripts and anything else local.
      # Only for host-side debugging:
      #   BASE_URL=http://localhost:18000 npx playwright test
      - "${E2E_PORT:-18000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 5s

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    depends_on:
      terminal:
        condition: service_healthy
    environment:
      BASE_URL: http://terminal:8000
      CI: "true"
    working_dir: /work
    volumes:
      - .:/work
      # Keeps the container's Linux install out of the host's test/ directory.
      - e2e-node-modules:/work/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"

volumes:
  e2e-node-modules:
